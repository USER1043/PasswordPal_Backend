name: Backend CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'

env:
  NODE_VERSION: '24'

jobs:
  # ──────────────────────────────────────────
  # JOB 1: Lint & Unit Tests
  # Runs ONLY on Pull Requests
  # ──────────────────────────────────────────
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          JWT_SECRET: ci-test-secret-do-not-use
          JWT_REFRESH_SECRET: ci-test-refresh-secret
          SESSION_SECRET: ci-test-session-secret
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_KEY: placeholder-key

  # ──────────────────────────────────────────
  # JOB 2: Security Audit (Runs IN PARALLEL with test)
  # Runs ONLY on Pull Requests
  # ──────────────────────────────────────────
  security:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit for vulnerabilities
        run: npm audit --audit-level=critical --omit=dev

  # ──────────────────────────────────────────
  # JOB 3: Notify on failure
  # ──────────────────────────────────────────
  notify-failure:
    name: Notify on Pipeline Failure
    runs-on: ubuntu-latest
    needs: [test, security]
    if: failure()

    steps:
      - name: Post failure notification
        run: |
          echo "Pipeline failed on branch ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
